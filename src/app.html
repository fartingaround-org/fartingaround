<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/FartingAround.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/FartingAround.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f5efe1" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171512" />
		<script>
			// Apply a saved theme before first paint so the page never flashes the other one.
			try { var t = localStorage.getItem('theme'); if (t === 'ink' || t === 'paper') document.documentElement.dataset.theme = t; } catch (e) {}
		</script>
		<meta property="og:image" content="%sveltekit.assets%/FartingAround.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
