# The Android app: test and build on every change to it, and attach a signed
# APK to each release.
#
# Signing needs four repository secrets (Settings → Secrets and variables →
# Actions). Without them the release job is skipped and nothing else changes.
#   APP_KEYSTORE_BASE64     the keystore file, base64-encoded:  base64 -i release.keystore | pbcopy
#   APP_KEYSTORE_PASSWORD
#   APP_KEY_ALIAS
#   APP_KEY_PASSWORD
# Keep the keystore and its passwords somewhere safe of your own as well: an
# app can only ever be updated by a build signed with the same key.
name: app

on:
  push:
    branches: [main]
    paths: ["capture/**", ".github/workflows/app.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["capture/**", ".github/workflows/app.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build (debug)
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fartingaround-debug-apk
          path: capture/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    # Only for a version tag, and only once the tests and the build have passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: capture
    env:
      HAVE_KEY: ${{ secrets.APP_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAVE_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAVE_KEY == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAVE_KEY == 'true'
      - name: Build and sign (release)
        if: env.HAVE_KEY == 'true'
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          FA_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          FA_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          FA_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          echo "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export FA_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/fartingaround-${GITHUB_REF_NAME}.apk"
      - name: Attach the APK to the release
        if: env.HAVE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Site image: ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/fartingaround-${GITHUB_REF_NAME}.apk" --clobber
      - name: No signing key
        if: env.HAVE_KEY != 'true'
        working-directory: .
        run: echo "No APP_KEYSTORE_BASE64 secret, so no APK was built for this release. See the top of .github/workflows/app.yml."
